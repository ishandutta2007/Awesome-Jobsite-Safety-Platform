<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #cbd5e1;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #f59e0b;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    /* Dynamic animated elements in background */
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(280px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 8px; opacity: 0.9; }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .scan-line {
      animation: scan 8s ease-in-out infinite;
    }
    .pulse-dot {
      animation: pulse 3s ease-in-out infinite;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 1;
      stroke-dasharray: 4 4;
      animation: dash 5s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Grid Pattern (Background) -->
  <g opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="300" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="300" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="300" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="300" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="300" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Scanning laser bar (Background layer) -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#accent-grad)" stroke-width="2" class="scan-line" filter="url(#glow)" />

  <!-- Animated HUD nodes -->
  <circle cx="300" cy="60" r="5" fill="#f59e0b" class="pulse-dot" />
  <circle cx="700" cy="240" r="5" fill="#ef4444" class="pulse-dot" style="animation-delay: 1s;" />
  <circle cx="900" cy="120" r="5" fill="#3b82f6" class="pulse-dot" style="animation-delay: 2s;" />

  <!-- Construction / Safety Visual Elements (Right Side Graphic) -->
  <g transform="translate(940, 60)" opacity="0.85">
    <!-- Helmet Icon Outline -->
    <path d="M 100 80 C 100 30 160 20 200 20 C 240 20 300 30 300 80 L 310 80 C 315 80 320 85 320 90 L 320 100 C 320 105 315 110 310 110 L 90 110 C 85 110 80 105 80 100 L 80 90 C 80 85 85 80 90 80 Z" fill="none" stroke="#f59e0b" stroke-width="4" />
    <path d="M 200 20 L 200 80" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4 2" />
    <!-- Safety Shield Graphic -->
    <path d="M 200 130 L 250 150 L 250 190 C 250 220 200 240 200 240 C 200 240 150 220 150 190 L 150 150 Z" fill="none" stroke="#3b82f6" stroke-width="3" />
    <path d="M 185 185 L 195 195 L 215 175" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content (Solid backdrop panel to guarantee crystal clear text readability) -->
  <rect x="50" y="45" width="850" height="210" rx="12" fill="#0f172a" opacity="0.75"/>
  <rect x="50" y="45" width="850" height="210" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Decorative Accent Pill -->
  <rect x="80" y="75" width="220" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <text x="95" y="94" class="tag">🛡️ EHS &amp; JOBSITE SAFETY</text>

  <!-- Foreground Main Title & Subtitle -->
  <text x="80" y="155" class="title">Awesome Jobsite Safety Platform</text>
  <text x="80" y="200" class="subtitle">Curated SaaS Products, AI PPE Detection &amp; Open-Source Tools</text>

  <!-- Bottom Accent Bar -->
  <rect x="80" y="225" width="790" height="4" rx="2" fill="url(#accent-grad)" />
</svg>
